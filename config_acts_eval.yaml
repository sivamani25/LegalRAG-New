ingest:
  raw_dir: data/raw
  processed_dir: data/pilot/processed/acts
  chunks_file: chunks.jsonl
  supported_extensions:
  - .pdf
  - .txt
  - .md
  categories:
  - name: acts
    path: acts
    default_jurisdiction: India
    chunking_strategy: pattern
    chunking_preset: acts
    citation_extraction: false
chunking:
  strategy: pattern
  sentence:
    max_chars: 1000
    min_chars: 50
  pattern:
    delimiters:
    - pattern: ^[ \t]*(?:Section|Article)\s+\d+
      level: 1
    - pattern: ^[ \t]*\d+\.\d+\.\d+
      level: 3
    - pattern: ^[ \t]*\d+\.\d+
      level: 2
    - pattern: ^[ \t]*\d+\.
      level: 1
    - pattern: ^[ \t]*\(\w+\)
      level: 3
  use_sac: true
  sac_use_llm: false
  sac_summary_max_chars: 150
  sac_llm_model: ''
  presets:
    generic:
      delimiters:
      - pattern: ^[ \t]*(?:Section|Article)\s+\d+
        level: 1
      - pattern: ^[ \t]*\d+\.\d+\.\d+
        level: 3
      - pattern: ^[ \t]*\d+\.\d+
        level: 2
      - pattern: ^[ \t]*\d+\.
        level: 1
      - pattern: ^[ \t]*\(\w+\)
        level: 3
    acts:
      delimiters:
      - pattern: ^[ \t]*(?i:Chapter|Part)\s+[IVXLCDM\d]+\b(?![,;])(?!.*\bsec(?:tion)?\b)
        level: 1
      - pattern: ^[ \t]*\d+[A-Z]?\.(?![ \t]+\d+(?!\[))(?![ \t]+(?:Subs|Ins|Rep|Added|Omitted by|Substituted|Inserted|Repealed|Renumbered|Amended|Vide)\.?\b)
        level: 2
      - pattern: ^[ \t]*(?:Section)\s+\d+[A-Z]?
        level: 2
      - pattern: ^[ \t]*\(\d+\)
        level: 3
      - pattern: ^[ \t]*\([a-z]\)
        level: 4
      - pattern: ^[ \t]*\([ivx]+\)
        level: 5
    constitution:
      delimiters:
      - pattern: ^[ \t]*(?:Part|Schedule)\s+[IVXLCDM]+[A-Z]?
        level: 1
      - pattern: ^[ \t]*(?:Article)\s+\d+[A-Z]?
        level: 2
      - pattern: ^[ \t]*\(\d+\)
        level: 3
      - pattern: ^[ \t]*\([a-z]\)
        level: 4
    contracts:
      delimiters:
      - pattern: ^[ \t]*[Aa]rticle\s+[IVXLCDM]+\b
        level: 1
      - pattern: ^[ \t]*[A-Z][A-Z\s]{4,}[A-Z]\b
        level: 1
      - pattern: ^[ \t]*(?:Section|§)\s+\d+
        level: 2
      - pattern: ^[ \t]*\d+\.\d+(?:\.\d+)*
        level: 3
      - pattern: ^[ \t]*\([a-z]\)
        level: 4
    judgments_structured:
      delimiters:
      - pattern: ^[ \t]*\d+\.
        level: 1
      - pattern: ^[ \t]*\([a-z]\)
        level: 2
retrieval:
  embedding_model: nomic-embed-text
  embedding_batch_size: 32
  index_dir: data/pilot/index/acts
  top_k: 10
  rrf_k: 60
  mmr_lambda: 0.7
  structural_boost_strength: 0.1
  use_structural_boost: true
  use_mmr: true
generation:
  provider: openrouter
  model: cohere/north-mini-code:free
  fallback_model: poolside/laguna-xs-2.1:free
  temperature: 0.2
  max_tokens: 1024
  ollama_base_url: ''
adaptive:
  enabled: true
  support_threshold: 1.0
  max_extra_rounds: 2
evaluation:
  k_values:
  - 1
  - 3
  - 5
  - 10
  embedding_ablation_models:
  - nomic-embed-text
  enable_ragas_style: true
  enable_claim_check: true
  enable_failure_tags: true
output:
  newline: '

    '
app:
  host: 127.0.0.1
  port: 8000
